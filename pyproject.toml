[project]
name = "dev-meter"
version = "0.1.0"
description = "A foundation for managed API infrastructure."
authors = [
    {name = "DevMeter"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic (>=1.14,<2.0)",
    "fastapi (>=0.115,<1.0)",
    "httpx (>=0.28,<1.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "pydantic-settings (>=2.0,<3.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "uvicorn[standard] (>=0.34,<1.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "pyjwt (>=2.8,<3.0)"
]

[tool.poetry]
packages = [{include = "dev_meter", from = "src"}]

[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
    "ruff (>=0.9,<1.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
